{% extends "base.html" %}
{% block body %}<div class="login"><h3>Welcome back</h3><p style="color:var(--muted);margin:0 0 14px">Sign in as an admin or a bus driver.</p>
{% if err %}<p style="color:var(--stop);font-weight:600">{{err}}</p>{% endif %}
<form method="post"><input name="username" placeholder="Username" autocomplete="username" required>
<input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button style="margin-top:10px;background:var(--amber);color:var(--ink)">Sign in</button></form>
<p><a href="/" style="color:var(--go);font-weight:600">Track a bus as a passenger</a></p></div>{% endblock %}
